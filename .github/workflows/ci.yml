name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The WASM runtime is built by the Pages workflow. The app resolves it at
      # runtime, so the production bundle can be checked without Emscripten.
      - name: Build
        run: npm run build

      - name: Verify the folder-scoped service worker is emitted
        run: test -f dist/coi-serviceworker.js
